<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>RAFALE — visionneuse de dev</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden}canvas{display:block;width:100%;height:100%}#i{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace;background:#0008;padding:4px 8px}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="c"></canvas><div id="i"></div>
<script type="module">
// Outil de dev : dev.html?map=port&cam=x,y,z,tx,ty,tz  |  dev.html?show=chars  |  dev.html?show=weapons
import * as THREE from 'three';
import { MAP, MAPS } from './js/world/maps.js';
import { getWorld } from './js/world/world.js';
import { WorldView } from './js/world/worldview.js';
import { Character } from './js/models/character.js';
import { weaponMesh } from './js/models/weapons.js';
import { WLIST } from './js/data/weapons.js';
import { OUTFITS, HEADS, BACKS, WSKINS } from './js/data/cosmetics.js';

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
const t0 = performance.now();
const world = getWorld(MAP[q.get('map') || 'port'], Number(q.get('seed') || 1234));
const t1 = performance.now();
const view = new WorldView(world, renderer, { shadows: true, shadowSize: 2048 });
view.addTo(scene);
const info = document.getElementById('i');
info.textContent = `${world.def.name} — monde ${(t1 - t0) | 0} ms, rendu ${(performance.now() - t1) | 0} ms, ${world.boxes.length} volumes, ${world.props.length} décors, ${world.lootSpots.length} butins`;
window.world = world;
const chars = [];
const show = q.get('show');
let c = (q.get('cam') || '60,45,90,0,2,0').split(',').map(Number);
if (show === 'chars') {
  const g = world.heightAt(0, 60) ;
  OUTFITS.forEach((o, i) => {
    const ch = new Character({ outfit: o.id, head: HEADS[i % HEADS.length].id, back: BACKS[i % BACKS.length].id, wskin: WSKINS[i % WSKINS.length].id, tone: i % 6, hair: i % 6 });
    ch.setWeapon(WLIST[i % WLIST.length].id);
    const x = (i % 8) * 1.3 - 4.5, z = 150 - ((i / 8) | 0) * 2.2;
    ch.root.position.set(x, world.groundAt(x, z, 50), z); ch.root.rotation.y = Math.PI;
    scene.add(ch.root); chars.push(ch);
  });
  c = [0, 5.2, 156.5, 0, 3, 149];
} else if (show === 'weapons') {
  WLIST.forEach((w, i) => { const m = weaponMesh(w.id, WSKINS[i % WSKINS.length].id); m.position.set((i % 6) * 1.1 - 2.8, 4.6 - ((i / 6) | 0) * 0.5, 150); m.rotation.y = Math.PI / 2; scene.add(m); });
  c = [0, 4.1, 153.2, 0, 4.0, 150];
}
cam.position.set(c[0], c[1], c[2]); cam.lookAt(c[3], c[4], c[5]);
let t = 0;
function loop() {
  t += 0.016;
  chars.forEach((ch, i) => ch.update(0.016, { speed: i % 3 === 0 ? 0 : i % 3 === 1 ? 4 : 7, moveAng: 0, pitch: Math.sin(t + i) * 0.3, crouch: i === 5, air: false, glide: i === 7, ads: i % 4 === 1, sprint: i % 3 === 2, reload: i === 3, dead: false }));
  view.update(cam); renderer.render(scene, cam); requestAnimationFrame(loop);
}
loop();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
</script>
</body>
</html>
